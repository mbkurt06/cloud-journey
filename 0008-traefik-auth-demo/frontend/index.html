<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Traefik Auth Demo</title>
  <style>
    body { font-family: Arial; }
    button {
      padding: 10px 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      border: none;
      margin-top: 10px;
    }
    .primary {
      background-color: #007bff;
      color: white;
    }
    .secondary {
      background-color: #28a745;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Traefik Auth Demo</h1>

  <h2>Login</h2>

  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" value="admin" required />
    <br /><br />
    <input type="password" id="password" placeholder="Password" value="admin123" required />
    <br /><br />
    <button class="primary" type="submit">Login</button>
  </form>

  <h2>Token</h2>
  <pre id="tokenOutput"></pre>

  <h2>Protected API</h2>
  <button class="secondary" id="protectedButton">Call Protected API</button>
  <pre id="protectedOutput"></pre>

  <script>
    let accessToken = "";

    const loginForm = document.getElementById("loginForm");
    const protectedButton = document.getElementById("protectedButton");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const response = await fetch("http://api.auth.localhost/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
      });

      const data = await response.json();

      accessToken = data.access_token || "";

      document.getElementById("tokenOutput").textContent =
        JSON.stringify(data, null, 2);
    });

    protectedButton.addEventListener("click", async () => {
      const response = await fetch("http://api.auth.localhost/protected", {
        method: "GET",
        headers: {
          "Authorization": "Bearer " + accessToken
        }
      });

      const data = await response.json();

      document.getElementById("protectedOutput").textContent =
        JSON.stringify(data, null, 2);
    });
  </script>
</body>
</html>
