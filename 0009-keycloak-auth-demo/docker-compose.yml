services:
  traefik:
    image: traefik:v3.6.2
    container_name: keycloakdemo-traefik
    command:
      - "--log.level=INFO"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=keycloakdemo-net"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /Users/mb/.docker/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - keycloakdemo-net

  postgres:
    image: postgres:16
    container_name: keycloakdemo-postgres
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloakpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - keycloakdemo-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloakdemo-keycloak
    command:
      - "start-dev"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin123
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloakpass
      - KC_HOSTNAME=keycloak.localhost
      - KC_HTTP_ENABLED=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.localhost`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    depends_on:
      - postgres
    networks:
      - keycloakdemo-net

  frontend:
    image: nginx:latest
    container_name: keycloakdemo-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`auth.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - keycloakdemo-net

  backend_api:
    build: ./backend
    container_name: keycloakdemo-backend-api
    environment:
      - KEYCLOAK_REALM=cloud-journey
      - KEYCLOAK_ISSUER=http://keycloak.localhost/realms/cloud-journey
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/cloud-journey
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-api.rule=Host(`api.auth.localhost`)"
      - "traefik.http.routers.backend-api.entrypoints=web"
      - "traefik.http.services.backend-api.loadbalancer.server.port=8000"
    depends_on:
      - keycloak
    networks:
      - keycloakdemo-net

  loki:
    image: grafana/loki:latest
    container_name: keycloakdemo-loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - keycloakdemo-net

  promtail:
    image: grafana/promtail:latest
    container_name: keycloakdemo-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks:
      - keycloakdemo-net

  grafana:
    image: grafana/grafana:latest
    container_name: keycloakdemo-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - loki
    networks:
      - keycloakdemo-net
  prometheus:
    image: prom/prometheus:latest
    container_name: keycloakdemo-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - keycloakdemo-net
networks:
  keycloakdemo-net:
    name: keycloakdemo-net

volumes:
  postgres-data:
  loki-data:
  grafana-data: