services:
  traefik:
    image: traefik:v3.6.2
    container_name: hostrouting-traefik
    command:
      - "--log.level=INFO"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=hostrouting-net"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /Users/mb/.docker/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hostrouting-net

  frontend:
    image: nginx:latest
    container_name: hostrouting-frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - hostrouting-net

  backend_api:
    build: ./backend
    environment:
      - HOSTROUTING_SERVICE_NAME=backend-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.backend-api.entrypoints=web"
      - "traefik.http.services.backend-api.loadbalancer.server.port=8000"
    networks:
      - hostrouting-net

networks:
  hostrouting-net:
    name: hostrouting-net